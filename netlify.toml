[[plugins]]
  package = "./plugins/trigger-algolia-scraper"

# Markdown versions of every docs page (see netlify/edge-functions/markdown-negotiation.js)
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
