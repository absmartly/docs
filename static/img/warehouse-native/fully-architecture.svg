<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fully-architecture-dark-title fully-architecture-dark-desc">
      <title id="fully-architecture-dark-title">Fully Warehouse Native architecture</title>
      <desc id="fully-architecture-dark-desc">Architecture diagram showing the customer's SDK sending exposures into their own warehouse, which is the default data source holding exposures, attributes, and goals, filtering and enriching every exposure before ABsmartly Cloud runs a scheduled query and returns only aggregate results, storing no user-level data.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9296a6"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#F4665C"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b7fff"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#111219"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="140" width="680" height="400" rx="8" fill="rgba(91,127,255,0.05)" stroke="rgba(91,127,255,0.35)" stroke-width="0.8"/>
      <rect x="64" y="146" width="244" height="16" rx="2" fill="#111219"/>
      <g transform="translate(70,150) scale(0.5)" fill="none" stroke="#5b7fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3" /><path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2" /><path d="M7 8l0 .01" /><path d="M7 16l0 .01" />
      </g>
      <text x="86" y="157" fill="#5b7fff" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">YOUR WAREHOUSE &#8212; DEFAULT</text>

      <rect x="800" y="140" width="320" height="280" rx="8" fill="rgba(244,102,92,0.06)" stroke="rgba(244,102,92,0.45)" stroke-width="0.8"/>
      <rect x="824" y="146" width="144" height="16" rx="2" fill="#111219"/>
      <g transform="translate(830,150) scale(0.5)" fill="none" stroke="#F4665C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" />
      </g>
      <text x="846" y="157" fill="#F4665C" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ABSMARTLY CLOUD</text>

      <!-- Arrows (before nodes) -->
      <path d="M 140,104 H 152 Q 160,104 160,112 V 188" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 160,252 H 210 Q 218,252 218,260 V 320" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 376,252 H 326 Q 318,252 318,260 V 320" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 268,384 H 422 Q 430,384 430,392 V 420" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 592,252 H 568 Q 560,252 560,260 V 420" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 580,440 H 698 Q 706,440 706,432 V 218 Q 706,210 714,210 H 832" fill="none" stroke="#F4665C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <path d="M 832,234 H 738 Q 730,234 730,242 V 452 Q 730,460 722,460 H 580" fill="none" stroke="#5b7fff" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels -->
      <rect x="646" y="314" width="48" height="12" rx="2" fill="#111219"/>
      <text x="670" y="323" fill="#F4665C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

      <rect x="742" y="344" width="48" height="12" rx="2" fill="#111219"/>
      <text x="766" y="353" fill="#5b7fff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>

      <!-- Node: SDK -->
      <rect x="40" y="40" width="200" height="64" rx="6" fill="#111219"/>
      <rect x="40" y="40" width="200" height="64" rx="6" fill="rgba(146,150,166,0.10)" stroke="#6f7487" stroke-width="1"/>
      <g transform="translate(54,58) scale(1.1667)" fill="none" stroke="#f5f5f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14" /><path d="M11 4h2" /><path d="M12 17v.01" />
      </g>
      <text x="92" y="70" fill="#f5f5f4" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Your app</text>
      <text x="92" y="86" fill="#9296a6" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">ABsmartly SDK</text>

      <!-- Node: Exposures -->
      <rect x="72" y="188" width="176" height="64" rx="6" fill="#111219"/>
      <rect x="72" y="188" width="176" height="64" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1"/>
      <g transform="translate(86,206) scale(1.1667)" fill="none" stroke="#f5f5f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" />
      </g>
      <text x="124" y="218" fill="#f5f5f4" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Exposures</text>
      <text x="124" y="234" fill="#9296a6" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">no server filter</text>

      <!-- Node: Your attributes -->
      <rect x="288" y="188" width="176" height="64" rx="6" fill="#111219"/>
      <rect x="288" y="188" width="176" height="64" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1"/>
      <g transform="translate(302,206) scale(1.1667)" fill="none" stroke="#f5f5f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" />
      </g>
      <text x="340" y="218" fill="#f5f5f4" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Your attributes</text>
      <text x="340" y="234" fill="#9296a6" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">segmentation</text>

      <!-- Node: Goals -->
      <rect x="504" y="188" width="176" height="64" rx="6" fill="#111219"/>
      <rect x="504" y="188" width="176" height="64" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1"/>
      <g transform="translate(518,206) scale(1.1667)" fill="none" stroke="#f5f5f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" />
      </g>
      <text x="556" y="218" fill="#f5f5f4" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Goals</text>
      <text x="556" y="234" fill="#9296a6" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">metrics table</text>

      <!-- Node: Filter and enrich (focal / link) -->
      <rect x="168" y="320" width="200" height="64" rx="6" fill="#111219"/>
      <rect x="168" y="320" width="200" height="64" rx="6" fill="rgba(91,127,255,0.12)" stroke="#5b7fff" stroke-width="1"/>
      <g transform="translate(182,338) scale(1.1667)" fill="none" stroke="#5b7fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M5 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M15 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M7 8l0 8" /><path d="M7 8a4 4 0 0 0 4 4h4" />
      </g>
      <text x="220" y="350" fill="#f5f5f4" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Filter &amp; enrich</text>
      <text x="220" y="366" fill="#9296a6" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">every exposure</text>

      <!-- Node: Query interface -->
      <rect x="380" y="420" width="200" height="64" rx="6" fill="#111219"/>
      <rect x="380" y="420" width="200" height="64" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1"/>
      <g transform="translate(394,438) scale(1.1667)" fill="none" stroke="#f5f5f4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" />
      </g>
      <text x="432" y="450" fill="#f5f5f4" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Query interface</text>
      <text x="432" y="466" fill="#9296a6" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">scheduled reads</text>

      <!-- Node: ABsmartly Cloud engine (focal / accent) -->
      <rect x="832" y="196" width="256" height="64" rx="6" fill="#111219"/>
      <rect x="832" y="196" width="256" height="64" rx="6" fill="rgba(244,102,92,0.12)" stroke="#F4665C" stroke-width="1"/>
      <g transform="translate(846,214) scale(1.1667)" fill="none" stroke="#F4665C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" />
      </g>
      <text x="884" y="222" fill="#f5f5f4" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Assignment stats</text>
      <text x="884" y="236" fill="#f5f5f4" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">&amp; governance</text>
      <text x="884" y="250" fill="#9296a6" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">no user-level data</text>

      <!-- Legend strip -->
      <line x1="40" y1="580" x2="1120" y2="580" stroke="rgba(245,245,244,0.14)" stroke-width="0.8"/>
      <text x="40" y="596" fill="#9296a6" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="608" width="14" height="10" rx="2" fill="rgba(91,127,255,0.05)" stroke="rgba(91,127,255,0.6)" stroke-width="1"/>
      <text x="60" y="616" fill="#9296a6" font-size="8.5" font-family="'Geist', sans-serif">Your warehouse</text>

      <rect x="196" y="608" width="14" height="10" rx="2" fill="rgba(244,102,92,0.06)" stroke="rgba(244,102,92,0.7)" stroke-width="1"/>
      <text x="216" y="616" fill="#9296a6" font-size="8.5" font-family="'Geist', sans-serif">ABsmartly Cloud</text>

      <line x1="360" y1="613" x2="388" y2="613" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="396" y="616" fill="#9296a6" font-size="8.5" font-family="'Geist', sans-serif">Data flow</text>

      <line x1="484" y1="613" x2="512" y2="613" stroke="#F4665C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="520" y="616" fill="#9296a6" font-size="8.5" font-family="'Geist', sans-serif">Scheduled query out</text>

      <line x1="672" y1="613" x2="700" y2="613" stroke="#5b7fff" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <text x="708" y="616" fill="#9296a6" font-size="8.5" font-family="'Geist', sans-serif">Aggregate results only</text>
    </svg>
