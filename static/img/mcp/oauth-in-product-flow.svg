<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 998" width="1040" height="998" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oauth-in-product-flow-title oauth-in-product-flow-desc">
      <title id="oauth-in-product-flow-title">OAuth via your instance's /mcp endpoint</title>
      <desc id="oauth-in-product-flow-desc">Sequence diagram of the in-product OAuth flow in 10 steps: the MCP client gets a 401 from your ABsmartly instance's /mcp endpoint, discovers its OAuth metadata, registers by Dynamic Client Registration or a trusted metadata-document client ID, and sends you through the browser to /auth/oauth/authorize, where you sign in if needed and always see a consent page; the client then exchanges the code for your ABsmartly session token, with no refresh token, and calls /mcp with it as a Bearer token.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9296a6"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#F4665C"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b7fff"/></marker>
        <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#F4665C"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#111219"/>

      <!-- Step bands -->
      <rect x="16" y="112" width="1008" height="50" rx="4" fill="#16171e"/>
      <rect x="16" y="260" width="1008" height="66" rx="4" fill="#16171e"/>
      <rect x="16" y="440" width="1008" height="34" rx="4" fill="#16171e"/>
      <rect x="16" y="556" width="1008" height="50" rx="4" fill="#16171e"/>
      <rect x="16" y="688" width="1008" height="108" rx="4" fill="#16171e"/>
      <!-- Lifelines -->
      <line x1="176" y1="80" x2="176" y2="882" stroke="rgba(245,245,244,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="456" y1="80" x2="456" y2="882" stroke="rgba(245,245,244,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="816" y1="80" x2="816" y2="882" stroke="rgba(245,245,244,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- Messages -->
      <path d="M 181,154 H 811" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="188" y="114" width="72" height="34" rx="2" fill="#16171e"/>
      <text x="192" y="127" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">POST /mcp</text>
      <text x="192" y="143" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">no token</text>
      <path d="M 811,236 H 181" fill="none" stroke="#5b7fff" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="188" y="180" width="396" height="50" rx="2" fill="#111219"/>
      <text x="192" y="193" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">401 Unauthorized</text>
      <text x="192" y="209" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">WWW-Authenticate: Bearer resource_metadata=…/.well-known/</text>
      <text x="192" y="225" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">  oauth-protected-resource/mcp, scope=&quot;mcp:access&quot;</text>
      <path d="M 181,318 H 811" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="188" y="262" width="328" height="50" rx="2" fill="#16171e"/>
      <text x="192" y="275" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Discovery</text>
      <text x="192" y="291" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">GET /.well-known/oauth-protected-resource/mcp</text>
      <text x="192" y="307" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">GET /.well-known/oauth-authorization-server</text>
      <path d="M 181,416 H 811" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="188" y="344" width="340" height="66" rx="2" fill="#111219"/>
      <text x="192" y="357" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Register, either:</text>
      <text x="192" y="373" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">POST /auth/oauth/register</text>
      <text x="192" y="389" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Dynamic Client Registration (DCR)</text>
      <text x="192" y="405" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">or a trusted metadata-document URL as client_id (CIMD)</text>
      <path d="M 181,466 H 453" fill="none" stroke="#5b7fff" stroke-width="1.2"/>
      <path d="M 461,466 H 811" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <circle cx="456" cy="466" r="3" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <rect x="188" y="442" width="357" height="18" rx="2" fill="#16171e"/>
      <text x="192" y="455" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">GET /auth/oauth/authorize?…&amp;code_challenge (S256)</text>
      <path d="M 811,532 H 461" fill="none" stroke="#F4665C" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="468" y="492" width="371" height="34" rx="2" fill="#111219"/>
      <text x="472" y="505" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">If not signed in: ABsmartly login</text>
      <text x="472" y="521" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">(SAML / SSO / password), then back to the authorize request</text>
      <path d="M 811,598 H 461" fill="none" stroke="#F4665C" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="468" y="558" width="180" height="34" rx="2" fill="#16171e"/>
      <text x="472" y="571" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Consent page: Approve / Deny</text>
      <text x="472" y="587" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">always shown</text>
      <path d="M 811,664 H 459" fill="none" stroke="#5b7fff" stroke-width="1.2"/>
      <path d="M 451,664 H 181" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <circle cx="456" cy="664" r="3" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <rect x="188" y="624" width="235" height="34" rx="2" fill="#111219"/>
      <text x="192" y="637" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Redirect to the client’s redirect_uri</text>
      <text x="192" y="653" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">?code&amp;state</text>
      <path d="M 181,730 H 811" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="188" y="690" width="164" height="34" rx="2" fill="#16171e"/>
      <text x="192" y="703" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">POST /auth/oauth/token</text>
      <text x="192" y="719" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">code + code_verifier</text>
      <path d="M 811,788 H 181" fill="none" stroke="#5b7fff" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <rect x="188" y="748" width="266" height="34" rx="2" fill="#16171e"/>
      <text x="192" y="761" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Access token: your ABsmartly session token</text>
      <text x="192" y="777" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">(no refresh token)</text>
      <path d="M 181,854 H 811" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="188" y="814" width="205" height="34" rx="2" fill="#111219"/>
      <text x="192" y="827" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace">POST /mcp</text>
      <text x="192" y="843" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">Authorization: Bearer &lt;token&gt;</text>
      <!-- Step numbers -->
      <circle cx="36" cy="137" r="11" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <text x="36" y="141" fill="#5b7fff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <circle cx="36" cy="211" r="11" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <text x="36" y="215" fill="#5b7fff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <circle cx="36" cy="293" r="11" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <text x="36" y="297" fill="#5b7fff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <circle cx="36" cy="383" r="11" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <text x="36" y="387" fill="#5b7fff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <circle cx="36" cy="457" r="11" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <text x="36" y="461" fill="#5b7fff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <circle cx="36" cy="515" r="11" fill="#111219" stroke="#F4665C" stroke-width="1.2"/>
      <text x="36" y="519" fill="#F4665C" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      <circle cx="36" cy="581" r="11" fill="#111219" stroke="#F4665C" stroke-width="1.2"/>
      <text x="36" y="585" fill="#F4665C" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>
      <circle cx="36" cy="647" r="11" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <text x="36" y="651" fill="#5b7fff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">8</text>
      <circle cx="36" cy="742" r="11" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <text x="36" y="746" fill="#5b7fff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">9</text>
      <circle cx="36" cy="837" r="11" fill="#111219" stroke="#5b7fff" stroke-width="1.2"/>
      <text x="36" y="841" fill="#5b7fff" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">10</text>
      <!-- Actors -->
      <rect x="74" y="24" width="204" height="56" rx="6" fill="#111219"/>
      <rect x="74" y="24" width="204" height="56" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1"/>
      <text x="176" y="48" fill="#f5f5f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP client</text>
      <text x="176" y="66" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">Claude · Cursor · VS Code</text>
      <rect x="356" y="24" width="200" height="56" rx="6" fill="#111219"/>
      <rect x="356" y="24" width="200" height="56" rx="6" fill="rgba(146,150,166,0.10)" stroke="#6f7487" stroke-width="1"/>
      <text x="456" y="48" fill="#f5f5f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
      <text x="456" y="66" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">you</text>
      <rect x="698" y="24" width="236" height="56" rx="6" fill="#111219"/>
      <rect x="698" y="24" width="236" height="56" rx="6" fill="rgba(244,102,92,0.10)" stroke="#F4665C" stroke-width="1"/>
      <text x="816" y="48" fill="#f5f5f4" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your ABsmartly instance</text>
      <text x="816" y="66" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">MCP /mcp · OAuth /auth/oauth/*</text>
      <!-- Legend -->
      <line x1="16" y1="898" x2="1024" y2="898" stroke="rgba(245,245,244,0.10)" stroke-width="0.8"/>
      <text x="24" y="918" fill="#9296a6" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <path d="M 112,914 H 140" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="150" y="918" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Client ↔ instance (OAuth + MCP)</text>
      <path d="M 377,914 H 405" stroke="#F4665C" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="415" y="918" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Sign-in and consent in the browser</text>
      <path d="M 661,914 H 689" stroke="#5b7fff" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
      <text x="699" y="918" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">Response</text>
      <circle cx="782" cy="914" r="3" fill="#111219" stroke="#9296a6" stroke-width="1.2"/>
      <text x="792" y="918" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif">redirect through the browser</text>
      <text x="24" y="958" fill="#9296a6" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Signing out of ABsmartly in the browser ends access for every connected MCP client.</text>
      <text x="24" y="974" fill="#9296a6" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Reconnect from the client to sign in again.</text>
</svg>
