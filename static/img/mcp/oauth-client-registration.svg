      <path d="M 660,352 H 738" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 540,404 V 462" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 220,404 V 470" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 220,536 V 602" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 340,656 H 398" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 220,708 V 806" fill="none" stroke="#9296a6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 680,504 H 852 Q 860,504 860,512 V 538" fill="none" stroke="#9296a6" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 680,656 H 852 Q 860,656 860,648 V 622" fill="none" stroke="#9296a6" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 400,840 H 342" fill="none" stroke="#9296a6" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 220,880 V 946" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 980,352 H 1000 Q 1008,352 1008,360 V 968 Q 1008,976 1000,976 H 982" fill="none" stroke="#5b7fff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Arrow labels -->
      <rect x="350" y="146" width="31" height="16" rx="2" fill="#111219"/>
      <text x="365" y="158" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="227" y="252" width="24" height="16" rx="2" fill="#111219"/>
      <text x="232" y="264" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">NO</text>
      <rect x="364" y="330" width="31" height="16" rx="2" fill="#111219"/>
      <text x="380" y="342" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="684" y="330" width="31" height="16" rx="2" fill="#111219"/>
      <text x="700" y="342" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <rect x="547" y="426" width="24" height="16" rx="2" fill="#111219"/>
      <text x="552" y="438" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">NO</text>
      <rect x="227" y="430" width="24" height="16" rx="2" fill="#111219"/>
      <text x="232" y="442" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">NO</text>
      <rect x="358" y="634" width="24" height="16" rx="2" fill="#111219"/>
      <text x="370" y="646" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <rect x="227" y="750" width="31" height="16" rx="2" fill="#111219"/>
      <text x="232" y="762" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
      <rect x="344" y="818" width="52" height="16" rx="2" fill="#111219"/>
      <text x="370" y="830" fill="#9296a6" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MANUAL</text>
      <!-- Nodes -->
      <rect x="110" y="34" width="220" height="44" rx="22" fill="#111219"/>
      <rect x="110" y="34" width="220" height="44" rx="22" fill="rgba(146,150,166,0.10)" stroke="#6f7487" stroke-width="1"/>
      <text x="220" y="60" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP client connects</text>
      <polygon points="220,116 340,168 220,220 100,168" fill="#111219"/>
      <polygon points="220,116 340,168 220,220 100,168" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1" stroke-linejoin="round"/>
      <text x="220" y="164" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Uses an</text>
