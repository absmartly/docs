      <rect x="390" y="128" width="300" height="80" rx="6" fill="rgba(79,178,134,0.10)" stroke="#4fb286" stroke-width="1"/>
      <text x="540" y="156" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API key auth</text>
      <text x="540" y="172" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">no OAuth registration needed</text>
      <text x="540" y="188" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">Authorization header or ?api_key=</text>
      <polygon points="220,300 340,352 220,404 100,352" fill="#111219"/>
      <polygon points="220,300 340,352 220,404 100,352" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1" stroke-linejoin="round"/>
      <text x="220" y="340" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">client_id</text>
      <text x="220" y="356" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">is a URL?</text>
      <text x="220" y="372" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">metadata document</text>
      <polygon points="540,300 660,352 540,404 420,352" fill="#111219"/>
      <polygon points="540,300 660,352 540,404 420,352" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1" stroke-linejoin="round"/>
      <text x="540" y="348" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">On the</text>
      <text x="540" y="364" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trusted list?</text>
      <rect x="740" y="312" width="240" height="80" rx="6" fill="#111219"/>
      <rect x="740" y="312" width="240" height="80" rx="6" fill="rgba(79,178,134,0.10)" stroke="#4fb286" stroke-width="1"/>
      <text x="860" y="340" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Accepted</text>
      <text x="860" y="356" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">metadata fetched, redirect</text>
      <text x="860" y="372" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">URIs filtered to the allowlist</text>
      <rect x="100" y="472" width="240" height="64" rx="6" fill="#111219"/>
      <rect x="100" y="472" width="240" height="64" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1"/>
      <text x="220" y="500" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dynamic Client Registration</text>
      <text x="220" y="516" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">POST /register</text>
      <rect x="400" y="464" width="280" height="80" rx="6" fill="#111219"/>
      <rect x="400" y="464" width="280" height="80" rx="6" fill="rgba(229,72,77,0.10)" stroke="#e5484d" stroke-width="1"/>
      <text x="540" y="492" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">Rejected: invalid_client</text>
      <text x="540" y="508" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">“This MCP client is not</text>
      <text x="540" y="524" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">supported by this server”</text>
      <polygon points="220,604 340,656 220,708 100,656" fill="#111219"/>
      <polygon points="220,604 340,656 220,708 100,656" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1" stroke-linejoin="round"/>
      <text x="220" y="652" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">All redirect_uris</text>
      <text x="220" y="668" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">allowed?</text>
      <rect x="400" y="624" width="280" height="64" rx="6" fill="#111219"/>
      <rect x="400" y="624" width="280" height="64" rx="6" fill="rgba(229,72,77,0.10)" stroke="#e5484d" stroke-width="1"/>
      <text x="540" y="652" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rejected:</text>
      <text x="540" y="668" fill="#f5f5f4" font-size="11.5" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">invalid_redirect_uri</text>
      <rect x="740" y="540" width="240" height="80" rx="6" fill="#111219"/>
      <rect x="740" y="540" width="240" height="80" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="860" y="568" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fallback</text>
      <text x="860" y="584" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">use an API key, or ask</text>
      <text x="860" y="600" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">ABsmartly support to add the client</text>
      <rect x="100" y="808" width="240" height="64" rx="6" fill="#111219"/>
      <rect x="100" y="808" width="240" height="64" rx="6" fill="rgba(79,178,134,0.10)" stroke="#4fb286" stroke-width="1"/>
      <text x="220" y="836" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Accepted</text>
      <text x="220" y="852" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">client_id (+ client_secret) issued</text>
      <rect x="400" y="792" width="280" height="96" rx="6" fill="#111219"/>
      <rect x="400" y="792" width="280" height="96" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#f5f5f4" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="540" y="812" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client can’t self-register?</text>
      <text x="540" y="828" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">e.g. Gemini Enterprise asks for</text>
      <text x="540" y="844" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">a client ID/secret: call POST /register</text>
      <text x="540" y="860" fill="#9296a6" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="middle">yourself once and paste the returned</text>
      <text x="540" y="876" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">client_id / client_secret</text>
      <rect x="100" y="948" width="880" height="56" rx="6" fill="#111219"/>
      <rect x="100" y="948" width="880" height="56" rx="6" fill="rgba(91,127,255,0.12)" stroke="#5b7fff" stroke-width="1"/>
      <text x="540" y="972" fill="#f5f5f4" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Every accepted OAuth client continues to the authorization flow</text>
      <text x="540" y="990" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">authorization code + PKCE S256 → consent page</text>
      <!-- Notes -->
      <text x="532" y="232" fill="#9296a6" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRUSTED LIST</text>
      <text x="532" y="248" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">Claude · Claude Code · VS Code</text>
      <text x="532" y="263" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">VS Code Insiders · Goose</text>
      <text x="532" y="278" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">GitHub Copilot CLI</text>
      <text x="400" y="708" fill="#9296a6" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ALLOWED REDIRECT_URIS</text>
      <text x="400" y="724" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">loopback http://localhost, 127.0.0.1</text>
      <text x="400" y="739" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">or [::1], any port</text>
      <text x="400" y="754" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">cursor:// · claude://</text>
      <text x="400" y="769" fill="#9296a6" font-size="11" font-family="'Geist Mono', monospace">allowlisted HTTPS callbacks</text>
</svg>
