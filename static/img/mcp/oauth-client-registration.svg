<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 1032" width="1040" height="1032" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oauth-client-registration-title oauth-client-registration-desc">
      <title id="oauth-client-registration-title">How an MCP client gets accepted</title>
      <desc id="oauth-client-registration-desc">Decision flowchart: a client that uses an API key is accepted without OAuth registration; otherwise a client whose client_id is a Client ID Metadata Document URL is accepted only if it is on the trusted list (Claude, Claude Code, VS Code, VS Code Insiders, Goose, GitHub Copilot CLI) and rejected with invalid_client if not, while any other client registers with Dynamic Client Registration at POST /register and is accepted only if all its redirect URIs are allowed (loopback, cursor://, claude://, or allowlisted HTTPS callbacks), else rejected with invalid_redirect_uri; clients that cannot self-register can have POST /register called for them manually, rejected clients can fall back to an API key or ask ABsmartly support, and every accepted OAuth client continues to the authorization code flow with PKCE S256 and the consent page.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9296a6"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#F4665C"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b7fff"/></marker>
        <marker id="arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#F4665C"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#111219"/>

